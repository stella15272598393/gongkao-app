<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE4EC"/>
      <stop offset="100%" style="stop-color:#FFCDD8"/>
    </linearGradient>
  </defs>
  <!-- 圆角背景 -->
  <rect width="512" height="512" rx="106" fill="url(#bg2)"/>
  <!-- 左耳 -->
  <ellipse cx="154" cy="166" rx="54" ry="85" fill="#FFFFFF" transform="rotate(-12 154 166)"/>
  <!-- 右耳 -->
  <ellipse cx="358" cy="166" rx="54" ry="85" fill="#FFFFFF" transform="rotate(12 358 166)"/>
  <!-- 圆脸（偏上居中，更大更圆润） -->
  <ellipse cx="256" cy="288" rx="144" ry="128" fill="#FFFFFF"/>
  <!-- 大眼睛 -->
  <ellipse cx="197" cy="277" rx="27" ry="35" fill="#444"/>
  <ellipse cx="315" cy="277" rx="27" ry="35" fill="#444"/>
  <!-- 眼睛高光 -->
  <circle cx="205" cy="264" r="9.5" fill="#FFF"/>
  <circle cx="323" cy="264" r="9.5" fill="#FFF"/>
  <!-- 鼻子 -->
  <ellipse cx="256" cy="310" rx="10.5" ry="8" fill="#FF91A4"/>
  <!-- 嘴（小w形） -->
  <path d="M239 322 Q248 334 256 322 Q264 334 273 322" stroke="#444" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <!-- 腮红 -->
  <ellipse cx="160" cy="308" rx="29" ry="18" fill="#FFB6C1" opacity="0.5"/>
  <ellipse cx="352" cy="308" rx="29" ry="18" fill="#FFB6C1" opacity="0.5"/>
  <!-- 胡须 -->
  <line x1="138" y1="292" x2="80" y2="280" stroke="#DDD" stroke-width="4" stroke-linecap="round"/>
  <line x1="138" y1="310" x2="80" y2="320" stroke="#DDD" stroke-width="4" stroke-linecap="round"/>
  <line x1="374" y1="292" x2="432" y2="280" stroke="#DDD" stroke-width="4" stroke-linecap="round"/>
  <line x1="374" y1="310" x2="432" y2="320" stroke="#DDD" stroke-width="4" stroke-linecap="round"/>
  <!-- 蝴蝶结（左耳上） -->
  <ellipse cx="146" cy="150" rx="40" ry="29" fill="#FF69B4"/>
  <circle cx="146" cy="150" r="11" fill="#E91E63"/>
  <ellipse cx="114" cy="140" rx="24" ry="17" fill="#FF69B4" transform="rotate(-18 114 140)"/>
  <ellipse cx="178" cy="140" rx="24" ry="17" fill="#FF69B4" transform="rotate(18 178 140)"/>
</svg>