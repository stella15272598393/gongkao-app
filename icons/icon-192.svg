<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE4EC"/>
      <stop offset="100%" style="stop-color:#FFCDD8"/>
    </linearGradient>
  </defs>
  <!-- 圆角背景 -->
  <rect width="192" height="192" rx="40" fill="url(#bg)"/>
  <!-- 左耳 -->
  <ellipse cx="58" cy="62" rx="20" ry="32" fill="#FFFFFF" transform="rotate(-12 58 62)"/>
  <!-- 右耳 -->
  <ellipse cx="134" cy="62" rx="20" ry="32" fill="#FFFFFF" transform="rotate(12 134 62)"/>
  <!-- 圆脸（偏上居中，更大更圆润） -->
  <ellipse cx="96" cy="108" rx="54" ry="48" fill="#FFFFFF"/>
  <!-- 大眼睛（像右边蓝色图标那种椭圆眼） -->
  <ellipse cx="74" cy="104" rx="10" ry="13" fill="#444"/>
  <ellipse cx="118" cy="104" rx="10" ry="13" fill="#444"/>
  <!-- 眼睛高光 -->
  <circle cx="77" cy="99" r="3.5" fill="#FFF"/>
  <circle cx="121" cy="99" r="3.5" fill="#FFF"/>
  <!-- 鼻子（小圆点） -->
  <ellipse cx="96" cy="116" rx="4" ry="3" fill="#FF91A4"/>
  <!-- 嘴（小w形） -->
  <path d="M90 121 Q93 125 96 121 Q99 125 102 121" stroke="#444" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- 腮红（明显的大椭圆） -->
  <ellipse cx="60" cy="116" rx="11" ry="7" fill="#FFB6C1" opacity="0.5"/>
  <ellipse cx="132" cy="116" rx="11" ry="7" fill="#FFB6C1" opacity="0.5"/>
  <!-- 胡须 -->
  <line x1="52" y1="110" x2="30" y2="105" stroke="#DDD" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="52" y1="116" x2="30" y2="120" stroke="#DDD" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="140" y1="110" x2="162" y2="105" stroke="#DDD" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="140" y1="116" x2="162" y2="120" stroke="#DDD" stroke-width="1.5" stroke-linecap="round"/>
  <!-- 蝴蝶结（左耳上） -->
  <ellipse cx="55" cy="56" rx="15" ry="11" fill="#FF69B4"/>
  <circle cx="55" cy="56" r="4" fill="#E91E63"/>
  <ellipse cx="43" cy="52" rx="9" ry="6.5" fill="#FF69B4" transform="rotate(-18 43 52)"/>
  <ellipse cx="67" cy="52" rx="9" ry="6.5" fill="#FF69B4" transform="rotate(18 67 52)"/>
</svg>