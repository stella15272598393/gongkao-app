name: 每日抓取内容更新

# 手机 PWA 联网自动更新机制：
#   GitHub Actions 每天定时运行抓取脚本，更新 content/*.json，
#   提交回仓库；GitHub Pages 直接托管整个仓库，PWA 在每次打开时
#   联网拉取最新 content/*.json（network-first），无需重新安装 APP。
on:
  workflow_dispatch: {}        # 每日由 cron-job.org 触发（POST dispatch）；Actions 页面也可手动触发验证
                             # 只保留这一个触发器 → 每天仅抓取一次（cron-job 已设为北京时间 20:00）

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: 抓取最新官方内容
        run: node scripts/update-all.js

      - name: 提交更新
        run: |
          git config user.name "小桃自动抓取"
          git config user.email "bot@workbuddy.local"
          git add content/
          if git diff --cached --quiet; then
            echo "内容无变化，跳过提交"
          else
            git commit -m "chore: 自动抓取更新 $(TZ=Asia/Shanghai date +%F)"
            git push
          fi
