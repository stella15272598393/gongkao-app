name: 每日抓取内容更新

# 手机 PWA 联网自动更新机制：
#   GitHub Actions 每天定时运行抓取脚本，更新 content/*.json，
#   提交回仓库；GitHub Pages 直接托管整个仓库，PWA 在每次打开时
#   联网拉取最新 content/*.json（network-first），无需重新安装 APP。
on:
  workflow_dispatch: {}        # 主触发器：cron-job.org 每天北京时间 20:00 调用（POST dispatch）
  schedule:
    - cron: '0 16 * * *'       # 冗余备份：北京时间每日 00:00（UTC 16:00）；防止 cron-job.org 失效时漏爬

concurrency:
  group: crawler
  cancel-in-progress: false    # 两个触发器若重叠则排队串行执行，互不取消/互不冲突（第二个发现无新内容会自动跳过）

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: 抓取最新官方内容
        run: node scripts/update-all.js

      - name: 提交更新
        run: |
          git config user.name "小桃自动抓取"
          git config user.email "bot@workbuddy.local"
          git add content/
          if git diff --cached --quiet; then
            echo "内容无变化，跳过提交"
          else
            git commit -m "chore: 自动抓取更新 $(TZ=Asia/Shanghai date +%F)"
            git push
          fi
